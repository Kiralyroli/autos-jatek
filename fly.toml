# fly.toml app configuration file generated for autos-jatek on 2026-08-29T15:01:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'autos-jatek'
primary_region = 'fra'

[build]

[env]
  DATA_DIR = '/data'

[[mounts]]
  source = 'autos_jatek_data'
  destination = '/data'

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
