# fly.toml app configuration file generated for autos-jatek on 2026-08-29T15:01:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'autos-jatek'
primary_region = 'fra'

[build]

[env]
  DATA_DIR = '/data'

[[mounts]]
  source = 'autos_jatek_data'
  destination = '/data'

[http_service]
  internal_port = 2567
  force_https = true
  # 'suspend': ugyanannyiba kerül, mint a 'stop' (csak a volume-ért fizetünk,
  # CPU/RAM-díj nincs, amíg a gép áll), de a felébredés ~200-300 ezredmásodperc
  # a 'stop' ~2+ másodperces hidegindítása helyett. EGYETLEN gépnél (nincs
  # több instance ugyanabban a régióban) a proxy csak akkor állítja le, ha a
  # forgalom TÉNYLEGESEN nulla (load=0) — egy aktív WebSocket-kapcsolat (valaki
  # épp versenyez) ezt kizárja, tehát futó verseny alatt nem szakadhat meg.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0 # 1 helyett — enélkül sose alhatna el

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256 # a "Machine Sizes" dashboard-választás értéke; a Fly generátora egy ELLENTMONDÓ memory='1gb' sort is berakott ide, azt kivettük
